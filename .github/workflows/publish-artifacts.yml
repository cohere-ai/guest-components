name: Publish artifacts with ORAS

on:
  push:
    branches:
    - main
    # Cohere version branches: cohere-v<upstream release>.
    - 'cohere-v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-aa:
    name: Publish attestation-agent
    permissions:
      contents: read
      packages: write # push OCI artifacts to ghcr.io
      id-token: write # required for OIDC-based attestation signing
      attestations: write # required to create build attestations
    strategy:
      matrix:
        platform: [
          { tee: none,        arch: x86_64,  libc: musl, runner: ubuntu-24.04 },
          { tee: none,        arch: s390x,   libc: gnu, runner: ubuntu-24.04-s390x },
          { tee: none,        arch: aarch64, libc: gnu, runner: ubuntu-24.04 },
          { tee: amd,         arch: x86_64,  libc: musl, runner: ubuntu-24.04 },
          { tee: az-cvm-vtpm, arch: x86_64,  libc: gnu, runner: ubuntu-24.04 },
          { tee: tdx,         arch: x86_64,  libc: musl, runner: ubuntu-24.04 },
          { tee: cca,         arch: x86_64,  libc: musl, runner: ubuntu-24.04 },
          { tee: cca,         arch: aarch64, libc: gnu, runner: ubuntu-24.04 },
          { tee: se,          arch: s390x,   libc: gnu, runner: ubuntu-24.04-s390x },
          { tee: none,        arch: powerpc64le,  libc: gnu, runner: ubuntu-24.04-ppc64le },
          # Cohere fork: AA with TDX + SNP + Azure SNP-vTPM + NVIDIA GPU
          # attesters. It links libtss2 + libnvat, so this variant must use gnu
          # libc. The tarball bundles libnvat and its non-glibc dependencies;
          # TSS2 comes from the consumer's image (tpm2-tools in the PodVM).
          { tee: tdx-snp-nvidia,  arch: x86_64,  libc: gnu, runner: ubuntu-24.04 },
        ]
    runs-on: ${{ matrix.platform.runner }}
    env:
      TEE_PLATFORM: ${{ matrix.platform.tee }}
      LIBC: ${{ matrix.platform.libc }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      RUST_TARGET: ${{ matrix.platform.arch }}-unknown-linux-${{ matrix.platform.libc }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Log in to the Container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      with:
        version: 1.2.0

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
        fetch-tags: true

    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        target: ${{ env.RUST_TARGET }}

    - name: Update apt source list
      run: |
        sudo apt-get update

    - name: Install tpm dependencies
      # az-snp-vtpm-attester links against TSS2.
      if: matrix.platform.tee == 'az-cvm-vtpm' || matrix.platform.tee == 'tdx-snp-nvidia'
      run: |
        sudo apt-get install -y --no-install-recommends libtss2-dev

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install NVIDIA Attestation SDK
      if: matrix.platform.tee == 'tdx-snp-nvidia'
      uses: ./.github/actions/install-nvat-sdk

    - name: Build AA
      env:
        ARCH: ${{ matrix.platform.arch }}
        LIBC: ${{ matrix.platform.libc }}
      run: |
        make ./target/${RUST_TARGET}/release/attestation-agent

    - name: Publish with ORAS
      id: publish
      env:
        OCI_ARCH: ${{ matrix.platform.arch == 'x86_64' && 'amd64' || matrix.platform.arch == 'aarch64' && 'arm64' || matrix.platform.arch == 'powerpc64le' && 'ppc64le' || matrix.platform.arch }}
        GIT_SHA: ${{ github.sha }}
        ARCH: ${{ matrix.platform.arch }}
      run: |
        mkdir oras
        cd oras
        cp ../target/${RUST_TARGET}/release/attestation-agent .
        # For the tdx-snp-nvidia variant, bundle libnvat and the non-glibc
        # shared libraries it needs, so consumers can install them with the
        # binary. This is not the binary's whole closure: libtss2-esys,
        # libtss2-tctildr and libtss2-mu (az-snp-vtpm-attester) are not bundled
        # and must come from the consumer's image (tpm2-tools in the PodVM).
        if [ "${TEE_PLATFORM}" = "tdx-snp-nvidia" ]; then
          mkdir -p lib
          libnvat="$(ldconfig -p | awk '$1 == "libnvat.so.1" { print $NF; exit }')"
          if [ -z "${libnvat}" ]; then
            echo "ERROR: libnvat.so not found after attestation-sdk install" >&2
            exit 1
          fi

          cp -a "$(dirname "${libnvat}")"/libnvat.so* lib/
          while read -r dependency; do
            if [[ "${dependency}" == *"=>"* ]]; then
              dependency_path="${dependency#*=> }"
              dependency_path="${dependency_path%% *}"
            else
              dependency_path="${dependency%% *}"
            fi

            [ -f "${dependency_path}" ] || continue
            dependency_name="$(basename "${dependency_path}")"
            case "${dependency_name}" in
              ld-linux-*|linux-vdso*|libc.so.*|libdl.so.*|libm.so.*|libpthread.so.*|librt.so.*|libutil.so.*|libresolv.so.*|libanl.so.*|libnss_*)
                continue
                ;;
            esac
            cp -L "${dependency_path}" "lib/${dependency_name}"
          done < <(ldd "${libnvat}")

          bundled_libnvat="$(LD_LIBRARY_PATH="${PWD}/lib" ldd attestation-agent \
            | awk '$1 ~ /^libnvat\.so/ { print $3; exit }')"
          if [[ "${bundled_libnvat}" != "${PWD}"/lib/* ]]; then
            echo "ERROR: attestation-agent does not resolve bundled libnvat" >&2
            exit 1
          fi
          tar cJf attestation-agent.tar.xz attestation-agent lib
        else
          tar cJf attestation-agent.tar.xz attestation-agent
        fi
        arch="${ARCH}"
        # After building for target powerpc64le, tag and push the image as ppc64le to match standard arch naming.
        [ "$arch" = "powerpc64le" ] && arch="ppc64le"
        arch_tag="${GIT_SHA}-${TEE_PLATFORM}_${arch}"
        image="${REGISTRY}/${IMAGE_NAME}/attestation-agent"
        tag="${GIT_SHA}-${TEE_PLATFORM}"
        oras push "${image}:${arch_tag}" attestation-agent.tar.xz
        # We need to create the platform annotations with docker, since oras 1.2 doesn't support
        # pushing with platform yet.
        docker manifest create "${image}:${tag}" --amend "${image}:${arch_tag}"
        docker manifest annotate --arch "${OCI_ARCH}" --os linux "${image}:${tag}" "${image}:${arch_tag}"
        docker manifest push "${image}:${tag}"
        # add image and digest to output for attestation
        echo "image=${image}" >> "$GITHUB_OUTPUT"
        digest="$(oras manifest fetch "${image}:${arch_tag}" --descriptor | jq -r .digest)"
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"

    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.publish.outputs.image }}
        subject-digest: ${{ steps.publish.outputs.digest }}
        push-to-registry: true

  publish-cdh-and-asr:
    name: Publish CDH and api-server-rest
    permissions:
      contents: read
      packages: write # push OCI artifacts to ghcr.io
      id-token: write # required for OIDC-based attestation signing
      attestations: write # required to create build attestations
    strategy:
      matrix:
        arch:
        - x86_64
        - s390x
        - aarch64
        - powerpc64le
        include:
        - arch: x86_64
          libc: musl
          instance: ubuntu-24.04
        - arch: s390x
          libc: gnu
          instance: ubuntu-24.04-s390x
        - arch: aarch64
          libc: gnu
          instance: ubuntu-24.04-arm
        - arch: powerpc64le
          libc: gnu
          instance: ubuntu-24.04-ppc64le
    runs-on: ${{ matrix.instance }}
    env:
      LIBC: ${{ matrix.libc }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      RUST_TARGET: ${{ matrix.arch }}-unknown-linux-${{ matrix.libc }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Log in to the Container registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      with:
        version: 1.2.0

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        target: ${{ env.RUST_TARGET }}

    - name: Install dependencies
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libdevmapper-dev pkg-config
        if [ "${ARCH}" = "powerpc64le" ]; then
          sudo apt-get install -y libclang-dev cmake protobuf-compiler
        fi

    - name: Build CDH
      env:
        ARCH: ${{ matrix.arch }}
        LIBC: ${{ matrix.libc }}
      run: make ./target/${RUST_TARGET}/release/confidential-data-hub

    - name: Build ASR
      env:
        ARCH: ${{ matrix.arch }}
        LIBC: ${{ matrix.libc }}
      run: make ./target/${RUST_TARGET}/release/api-server-rest

    - name: Publish CDH + ASR with ORAS
      id: publish
      env:
        GIT_SHA: ${{ github.sha }}
        ARCH: ${{ matrix.arch }}
      run: |
        arch="${ARCH}"
        # After building for target powerpc64le, tag and push the image as ppc64le to match standard arch naming.
        [ "$arch" = "powerpc64le" ] && arch="ppc64le"
        tag="${GIT_SHA}-${arch}"
        mkdir oras
        cd oras
        cp ../target/${RUST_TARGET}/release/{confidential-data-hub,api-server-rest} .

        tar cJf confidential-data-hub.tar.xz confidential-data-hub
        image="${REGISTRY}/${IMAGE_NAME}/confidential-data-hub"
        oras push "${image}:${tag}" confidential-data-hub.tar.xz
        echo "cdh-image=${image}" >> "$GITHUB_OUTPUT"
        digest="$(oras manifest fetch "${image}:${tag}" --descriptor | jq -r .digest)"
        echo "cdh-digest=${digest}" >> "$GITHUB_OUTPUT"

        tar cJf api-server-rest.tar.xz api-server-rest
        image="${REGISTRY}/${IMAGE_NAME}/api-server-rest"
        oras push "${image}:${tag}" api-server-rest.tar.xz
        echo "asr-image=${image}" >> "$GITHUB_OUTPUT"
        digest="$(oras manifest fetch "${image}:${tag}" --descriptor | jq -r .digest)"
        echo "asr-digest=${digest}" >> "$GITHUB_OUTPUT"

    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.publish.outputs.cdh-image }}
        subject-digest: ${{ steps.publish.outputs.cdh-digest }}
        push-to-registry: true

    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.publish.outputs.asr-image }}
        subject-digest: ${{ steps.publish.outputs.asr-digest }}
        push-to-registry: true
